apiVersion: v1alpha1
kind: Setting
metadata:
  name: my-docs-settings
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: select
          name: defaultSort
          label: 默认排序
          value: priorityAsc
          options:
            - label: 排序权重升序
              value: priorityAsc
            - label: 创建时间倒序
              value: createdDesc
            - label: 标题升序
              value: titleAsc
        - $formkit: text
          name: defaultLibraryName
          label: 默认文档库
          value: ""
        - $formkit: number
          name: libraryIndexDefaultColumns
          label: 文档库首页默认每行个数
          value: 2
          validation: required|min:1|max:12
        - $formkit: number
          name: libraryIndexDefaultMaxRows
          label: 文档库首页默认每页最大行数
          value: 2
          validation: required|min:1|max:24
        - $formkit: text
          name: renderContentThemeLightUrl
          label: 浅色主题 CSS 地址
          help: "可选，仅支持 https:// 或 / 开头的站内绝对路径；留空时使用基础回退样式。"
          value: ""
        - $formkit: text
          name: renderContentThemeLightClass
          label: 浅色正文容器 class
          value: markdown-body
        - $formkit: text
          name: renderContentThemeDarkUrl
          label: 深色主题 CSS 地址
          help: "可选，仅支持 https:// 或 / 开头的站内绝对路径；留空时使用基础回退样式。"
          value: ""
        - $formkit: text
          name: renderContentThemeDarkClass
          label: 深色正文容器 class
          value: markdown-body
        - $formkit: text
          name: renderCodeThemeLight
          label: 浅色代码主题
          value: github
        - $formkit: text
          name: renderCodeThemeDark
          label: 深色代码主题
          value: github-dark
        - $formkit: switch
          name: renderLineNumber
          label: 代码行号
          help: 为普通围栏代码块显示行号。
          value: false
        - $formkit: switch
          name: renderAutoSpace
          label: 自动空格
          help: 在中文与英文、数字的边界自动补空格。
          value: false
        - $formkit: switch
          name: renderGfmAutoLink
          label: 自动链接
          help: 把 Markdown 中的裸 URL 自动转换为链接。
          value: true
        - $formkit: switch
          name: renderFootnotes
          label: 脚注
          help: 解析 [^1] 形式的 Markdown 脚注。
          value: true
        - $formkit: switch
          name: renderMark
          label: Mark 标记
          help: 把 ==文字== 渲染为高亮标记。
          value: false
        - $formkit: switch
          name: renderFixTermTypo
          label: 术语修正
          help: 修正常见技术术语的大小写，例如 github → GitHub。
          value: false
        - $formkit: switch
          name: renderParagraphBeginningSpace
          label: 段首空两格
          help: 为正文顶层段落添加两字符首行缩进。
          value: false
        - $formkit: switch
          name: renderCodeBlockPreview
          label: 图表代码块渲染
          help: 渲染 Mermaid、Graphviz、ECharts、Markmap 等特殊代码块。
          value: true
        - $formkit: switch
          name: renderMathBlockPreview
          label: 数学公式渲染
          help: 使用 RaTeX（WASM + Canvas）渲染 $...$ 与 $$...$$ 公式，失败时回退到 Vditor。
          value: true
        - $formkit: switch
          name: renderCopyButtons
          label: 复制按钮
          help: 为代码块、图片和块级公式显示复制按钮。
          value: true
        - $formkit: switch
          name: renderImageZoom
          label: 图片点击放大
          help: 点击正文图片以灯箱形式放大查看。
          value: true
        - $formkit: switch
          name: renderMediaEmbed
          label: 视频内嵌播放
          help: 把图片语法引用的 mp4、webm、m3u8 等视频文件渲染为内嵌播放器（DPlayer）。
          value: true
        - $formkit: switch
          name: mediaProxyEnabled
          label: 媒体同域代理
          help: 把下方允许清单里主机的图片、音视频地址改写成站点自身的 /media-proxy 地址，由服务端代取。适用于对象存储桶不对公网开放、附件 permalink 只是裸对象地址的情况；关闭后前台直连原始地址。
          value: false
        - $formkit: textarea
          name: mediaProxyAllowedHosts
          label: 媒体代理允许主机
          help: "每行一个主机名，例如 media.example.com 或 *.r2.cloudflarestorage.com。只有这里列出的主机才会被代理，留空即完全关闭代理。"
          value: ""
          rows: 4
        - $formkit: textarea
          name: mediaProxyRequestHeaders
          label: 媒体代理附加请求头
          help: "可选，每行一条，格式为「主机: 头名: 头值」，例如 media.example.com: Authorization: Bearer xxx。主机不要带端口（写 media.example.com:8443 会被当成头名而整条失效），头值里可以带冒号。仅对上面允许清单内的主机生效，用于私有对象存储。注意：代理端点对访客开放，凭证只按主机匹配、没有路径限制，配了凭证就等于把该主机对公网开放读取；请只填只读、可随时吊销、且确实需要公开的媒体凭证。头值只保存在服务端设置里，不会输出到页面。"
          value: ""
          rows: 3
        - $formkit: textarea
          name: mediaProxyCredentialRules
          label: 媒体代理签名凭证
          help: "私有桶的 S3 凭证，每行一条，格式为「主机: 键: 值」，键取 access、secret，可选 region（默认 auto），例如 media.example.com: access: <AccessKeyId> 与 media.example.com: secret: <SecretAccessKey>。R2 / S3 不认静态 Bearer 令牌，GetObject 必须是签名请求，所以凭证填在这里而不是上面的附加请求头。只保存在服务端设置里，不会输出到页面。"
          value: ""
          rows: 4
        - $formkit: number
          name: mediaProxyMaxBytes
          label: 媒体代理大小上限（字节）
          help: 单个媒体文件超过该值时中断，默认 536870912（512 MiB）。
          value: 536870912
          validation: required|min:1048576
        - $formkit: textarea
          name: customHeadHtml
          label: 全局自定义 head 代码
          help: "⚠️ 原样注入到全部文档阅读页 <head> 末尾，在访客浏览器执行。可放 <style>、meta、统计脚本。请仅填入可信代码。"
          value: ""
          rows: 5
        - $formkit: textarea
          name: customBodyHtml
          label: 全局自定义 body 代码
          help: "⚠️ 原样注入到全部文档阅读页 <body> 末尾，在访客浏览器执行。可放自定义 HTML、<script>。请仅填入可信代码。"
          value: ""
          rows: 5
